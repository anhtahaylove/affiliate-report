<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Affiliate Report</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f4; color: #17201d; }
      main { width: min(34rem, calc(100% - 2rem)); text-align: center; }
      .mark { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: .85rem; background: #052f35; color: #91f5df; font-weight: 800; }
      h1 { font-size: 1.35rem; margin: 1rem 0 .4rem; }
      p { color: #52605b; margin: 0; line-height: 1.55; }
      button { margin-top: 1rem; min-height: 2.75rem; border: 0; border-radius: .75rem; padding: 0 1rem; font: inherit; font-weight: 700; background: #087e8b; color: white; }
      button[hidden] { display: none; }
      @media (prefers-color-scheme: dark) { body { background: #101614; color: #edf4f0; } p { color: #aebdb7; } }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div class="mark" aria-hidden="true">AFF</div>
      <h1>Đang mở Affiliate Report</h1>
      <p id="status">Đang chuẩn bị dữ liệu cục bộ trên thiết bị…</p>
      <button id="retry" type="button" hidden>Thử lại</button>
    </main>
    <script>
      const statusNode = document.querySelector("#status");
      const retryButton = document.querySelector("#retry");
      window.affiliateReportStartupFailed = (message) => {
        statusNode.textContent = message;
        retryButton.hidden = false;
      };
      retryButton.addEventListener("click", () => location.reload());
    </script>
  </body>
</html>
