name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: signed-public-update-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: affiliate_report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d affiliate_report_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/affiliate_report_test
    steps:
      - name: Require successful installer smoke for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          run_count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/windows-installer-smoke.yml/runs?head_sha=$RELEASE_SHA&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | length')"
          if [ "$run_count" -lt 1 ]; then
            echo "::error::Tag commit $RELEASE_SHA has no successful post-merge Windows installer smoke on main. Wait for that workflow, then rerun this release."
            exit 1
          fi
          echo "Exact commit $RELEASE_SHA has a successful post-merge Windows installer smoke." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify API, migration and web
        run: |
          python -m pip install --disable-pip-version-check -r requirements-api.txt
          python -m pytest -q
          python -m compileall -q affiliate_report scripts tests desktop_launcher.py
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web lint
          pnpm --dir web exec tsc --noEmit --pretty false
          pnpm --dir web test:unit
          pnpm --dir web build
          pnpm --dir web audit --prod

  windows-installer:
    needs: verify
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install build tools
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-api.txt "pyinstaller==6.21.0"
          choco install innosetup --no-progress -y
      - name: Verify version and tests
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $appVersion = & .\.venv\Scripts\python.exe -c "from affiliate_report.version import APP_VERSION; print(APP_VERSION)"
          if ($appVersion -ne $version) { throw "Tag $version does not match APP_VERSION $appVersion" }
          .\.venv\Scripts\python.exe -m pytest -q
          .\.venv\Scripts\python.exe -m compileall -q affiliate_report scripts tests desktop_launcher.py
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web lint
          pnpm --dir web exec tsc --noEmit --pretty false
          pnpm --dir web test:unit
          pnpm --dir web audit --prod
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\packaging\build_installer.ps1 -AppVersion $version
      - name: Sign public update feed
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $repo = "anhtahaylove/affiliate-report"
          $keyId = "tiktok-report-updates-2026-08"
          $publicKey = .\.venv\Scripts\python.exe -m scripts.sign_update_feed --version $version --installer "artifacts\installer\AffiliateReportSetup-v$version.exe" --bootstrap "artifacts\installer\TikTokAffiliateUpdater-v1.0.0.ps1" --asset-url "https://github.com/$repo/releases/download/$tag/AffiliateReportSetup-v$version.exe" --bootstrap-url "https://github.com/$repo/releases/download/$tag/TikTokAffiliateUpdater-v1.0.0.ps1" --release-url "https://github.com/$repo/releases/tag/$tag" --key-id $keyId --output-dir "artifacts\installer" --print-public-key | Select-Object -First 1
          $pinned = .\.venv\Scripts\python.exe -c "from affiliate_report.updater import TRUSTED_UPDATE_KEYS; print(TRUSTED_UPDATE_KEYS['$keyId'])"
          if ($publicKey -ne $pinned) { throw "UPDATE_SIGNING_KEY_B64 does not match pinned updater public key" }
      - name: Create verified private release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $installer = "artifacts\installer\AffiliateReportSetup-v$version.exe"
          $existingJson = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (!$existing.isDraft) { throw "Private release $tag is already published" }
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not replace existing private draft release" }
          }
          gh release create $tag $installer "artifacts\installer\TikTokAffiliateUpdater-v1.0.0.ps1" "artifacts\installer\SHA256SUMS.txt" "artifacts\installer\stable.json" "artifacts\installer\stable.json.sig" --draft --generate-notes --title "Affiliate Report $tag" --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Could not create private draft release" }
          $draft = gh release view $tag --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$draft.isDraft -or $draft.isPrerelease -or $draft.tagName -ne $tag) { throw "Private release draft verification failed" }
      - name: Verify private draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $verify = Join-Path $env:RUNNER_TEMP "release-verify"
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $tag --dir $verify
          if ($LASTEXITCODE -ne 0) { throw "Could not download private draft release" }
          $actualFiles = @(Get-ChildItem -LiteralPath $verify -File | ForEach-Object Name | Sort-Object)
          $expectedFiles = @("SHA256SUMS.txt", "AffiliateReportSetup-v$version.exe", "TikTokAffiliateUpdater-v1.0.0.ps1", "stable.json", "stable.json.sig") | Sort-Object
          if (Compare-Object $actualFiles $expectedFiles) { throw "Release must contain exactly installer, updater bootstrap, SHA256SUMS.txt, stable.json and stable.json.sig" }
          $installerName = "AffiliateReportSetup-v$version.exe"
          $checksumLines = @(Get-Content (Join-Path $verify "SHA256SUMS.txt"))
          $checksumNames = @($checksumLines | ForEach-Object {
            $match = [regex]::Match($_, '^([A-Fa-f0-9]{64})  (AffiliateReportSetup-v\d+\.\d+\.\d+\.exe|TikTokAffiliateUpdater-v\d+\.\d+\.\d+\.ps1)$')
            if (!$match.Success) { throw "SHA256SUMS contains a malformed or unexpected entry" }
            $match.Groups[2].Value
          } | Sort-Object)
          $expectedChecksumNames = @($installerName, "TikTokAffiliateUpdater-v1.0.0.ps1") | Sort-Object
          if ($checksumLines.Count -ne 2 -or (Compare-Object $checksumNames $expectedChecksumNames)) { throw "SHA256SUMS must contain exactly the installer and updater bootstrap" }
          $installerEntry = @($checksumLines | Where-Object { $_ -match ([regex]::Escape($installerName) + '$') })
          $bootstrapEntry = @($checksumLines | Where-Object { $_ -match 'TikTokAffiliateUpdater-v1\.0\.0\.ps1$' })
          if ($installerEntry.Count -ne 1 -or $bootstrapEntry.Count -ne 1) { throw "SHA256SUMS must contain exactly one installer and one updater bootstrap entry" }
          $expected = ([regex]::Match($installerEntry[0], '^([A-Fa-f0-9]{64})').Groups[1].Value).ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $verify $installerName)).Hash
          if ($actual -ne $expected) { throw "Downloaded release checksum mismatch" }
          $bootstrapExpected = ([regex]::Match($bootstrapEntry[0], '^([A-Fa-f0-9]{64})').Groups[1].Value).ToUpperInvariant()
          $bootstrapActual = (Get-FileHash -Algorithm SHA256 (Join-Path $verify "TikTokAffiliateUpdater-v1.0.0.ps1")).Hash
          if ($bootstrapActual -ne $bootstrapExpected) { throw "Downloaded updater bootstrap checksum mismatch" }
          $draft = gh release view $tag --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$draft.isDraft -or $draft.isPrerelease -or $draft.tagName -ne $tag) { throw "Private release verification failed" }
      - name: Create and verify public update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $repo = "anhtahaylove/affiliate-report"
          $assets = @("artifacts\installer\AffiliateReportSetup-v$version.exe", "artifacts\installer\TikTokAffiliateUpdater-v1.0.0.ps1", "artifacts\installer\SHA256SUMS.txt", "artifacts\installer\stable.json", "artifacts\installer\stable.json.sig")
          # Một repo duy nhất: bản nháp ở đây CHÍNH LÀ bản vừa tạo và xác minh ở bước trước, mang
          # đúng năm asset đó. Ở mô hình hai repo, bước này tạo một release mới tinh bên kho kia
          # nên xoá-rồi-tạo-lại là vô hại. Cùng một kho thì nó thành tạo → xoá → tạo lại trên
          # cùng một tag, và asset không kịp xuất hiện công khai cho bước tải ẩn danh ngay sau —
          # đúng chỗ v2.0.14 dừng lại. Dùng lại bản đã xác minh thay vì dựng lại.
          $existingJson = gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (!$existing.isDraft) { throw "Public release $tag is already published" }
            Write-Host "Reusing the verified draft release as the public release."
          } else {
            gh release create $tag @assets --repo $repo --draft --latest=false --title "Affiliate Report $tag" --notes "Public auto-update feed for $tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not create public draft release" }
          }
          $verify = Join-Path $env:RUNNER_TEMP "public-release-verify"
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $tag --repo $repo --dir $verify
          if ($LASTEXITCODE -ne 0) { throw "Could not download public draft release" }
          $actualFiles = @(Get-ChildItem -LiteralPath $verify -File | ForEach-Object Name | Sort-Object)
          $expectedFiles = @("SHA256SUMS.txt", "AffiliateReportSetup-v$version.exe", "TikTokAffiliateUpdater-v1.0.0.ps1", "stable.json", "stable.json.sig") | Sort-Object
          if (Compare-Object $actualFiles $expectedFiles) { throw "Public mirror must contain exactly five verified assets" }
          $installerName = "AffiliateReportSetup-v$version.exe"
          $checksumLines = @(Get-Content (Join-Path $verify "SHA256SUMS.txt"))
          $checksumNames = @($checksumLines | ForEach-Object {
            $match = [regex]::Match($_, '^([A-Fa-f0-9]{64})  (AffiliateReportSetup-v\d+\.\d+\.\d+\.exe|TikTokAffiliateUpdater-v\d+\.\d+\.\d+\.ps1)$')
            if (!$match.Success) { throw "SHA256SUMS contains a malformed or unexpected entry" }
            $match.Groups[2].Value
          } | Sort-Object)
          $expectedChecksumNames = @($installerName, "TikTokAffiliateUpdater-v1.0.0.ps1") | Sort-Object
          if ($checksumLines.Count -ne 2 -or (Compare-Object $checksumNames $expectedChecksumNames)) { throw "SHA256SUMS must contain exactly the installer and updater bootstrap" }
          $installerEntry = @($checksumLines | Where-Object { $_ -match ([regex]::Escape($installerName) + '$') })
          $bootstrapEntry = @($checksumLines | Where-Object { $_ -match 'TikTokAffiliateUpdater-v1\.0\.0\.ps1$' })
          if ($installerEntry.Count -ne 1 -or $bootstrapEntry.Count -ne 1) { throw "SHA256SUMS must contain exactly one installer and one updater bootstrap entry" }
          $expected = ([regex]::Match($installerEntry[0], '^([A-Fa-f0-9]{64})').Groups[1].Value).ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $verify $installerName)).Hash
          if ($actual -ne $expected) { throw "Public mirror checksum mismatch" }
          $bootstrapExpected = ([regex]::Match($bootstrapEntry[0], '^([A-Fa-f0-9]{64})').Groups[1].Value).ToUpperInvariant()
          $bootstrapActual = (Get-FileHash -Algorithm SHA256 (Join-Path $verify "TikTokAffiliateUpdater-v1.0.0.ps1")).Hash
          if ($bootstrapActual -ne $bootstrapExpected) { throw "Public mirror updater bootstrap checksum mismatch" }
          .\.venv\Scripts\python.exe -c "from pathlib import Path; import hashlib; from affiliate_report import updater; m=updater.verify_update_manifest_bytes(Path(r'$verify\stable.json').read_bytes(), Path(r'$verify\stable.json.sig').read_bytes()); installer=Path(r'$verify\AffiliateReportSetup-v$version.exe'); bootstrap=Path(r'$verify\TikTokAffiliateUpdater-v1.0.0.ps1'); assert m['version'] == '$version'; assert m['release_url'] == 'https://github.com/$repo/releases/tag/$tag'; assert m['installer']['url'] == 'https://github.com/$repo/releases/download/$tag/AffiliateReportSetup-v$version.exe'; assert m['installer']['name'] == installer.name; assert m['installer']['size'] == installer.stat().st_size; assert m['installer']['sha256'] == '$actual'; assert m['bootstrap']['url'] == 'https://github.com/$repo/releases/download/$tag/TikTokAffiliateUpdater-v1.0.0.ps1'; assert m['bootstrap']['name'] == bootstrap.name; assert m['bootstrap']['size'] == bootstrap.stat().st_size; assert m['bootstrap']['sha256'] == hashlib.sha256(bootstrap.read_bytes()).hexdigest().upper()"
          if ($LASTEXITCODE -ne 0) { throw "Public draft manifest verification failed" }
          $draft = gh release view $tag --repo $repo --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$draft.isDraft -or $draft.isPrerelease -or $draft.tagName -ne $tag) { throw "Public release verification failed" }
      # Feed đã chuyển về repo nguồn từ v2.0.11 (updater.py đọc URL này). Asset vẫn nằm ở repo
      # cũ vì mô hình phát hành hai tầng cần một nơi công bố sớm để gate tải xuống được, còn
      # release ở repo nguồn chỉ được công bố ở bước cuối cùng.
      - uses: actions/checkout@v7
        with:
          repository: anhtahaylove/affiliate-report
          # Workflow này chạy do push TAG, nên actions/checkout mặc định lấy refs/tags/<tag> và
          # để lại detached HEAD — git push sau đó chết với "You are not currently on a branch".
          # Mô hình hai kho không gặp vì checkout là kho khác nên tag không áp dụng, nó tự lấy
          # nhánh mặc định. Cùng một kho thì phải nói rõ nhánh.
          ref: main
          token: ${{ github.token }}
          path: update-feed
      - name: Promote public stable feed and releases
        shell: pwsh
        env:
          PRIVATE_GH_TOKEN: ${{ github.token }}
          PUBLIC_GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $repo = "anhtahaylove/affiliate-report"
          $feedRepo = $repo
          $assetNames = @("SHA256SUMS.txt", "AffiliateReportSetup-v$version.exe", "TikTokAffiliateUpdater-v1.0.0.ps1", "stable.json", "stable.json.sig")
          $stableCommitted = $false
          $stableCommit = ""
          $publicPublished = $false
          $privatePublished = $false
          $rollbackFeed = Join-Path $env:RUNNER_TEMP "previous-stable-feed"
          New-Item -ItemType Directory -Path $rollbackFeed -Force | Out-Null

          # Snapshot the last public latest release before mutating either the feed or release state.
          # These signed bytes are the fail-closed rollback source even when this workflow is rerun.
          $env:GH_TOKEN = $env:PUBLIC_GH_TOKEN
          $publicBefore = gh release list --repo $repo --limit 100 --json tagName,isDraft,isLatest,isPrerelease,publishedAt | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the previous public latest release" }
          $previousLatest = @($publicBefore | Where-Object { !$_.isDraft -and !$_.isPrerelease -and $_.tagName -ne $tag } | Sort-Object publishedAt -Descending | Select-Object -First 1)
          if ($previousLatest.Count -ne 1) { throw "Expected exactly one previous stable public release before $tag" }
          $previousLatestTag = $previousLatest[0].tagName
          gh release download $previousLatestTag --repo $repo --pattern stable.json --pattern stable.json.sig --dir $rollbackFeed
          if ($LASTEXITCODE -ne 0) { throw "Could not snapshot the previous signed stable feed from $previousLatestTag" }
          $previousManifest = Join-Path $rollbackFeed "stable.json"
          $previousSignature = Join-Path $rollbackFeed "stable.json.sig"
          $previousManifestHash = (Get-FileHash -Algorithm SHA256 $previousManifest).Hash
          $previousSignatureHash = (Get-FileHash -Algorithm SHA256 $previousSignature).Hash
          $previousVersion = $previousLatestTag.TrimStart("v")
          .\.venv\Scripts\python.exe -c "from pathlib import Path; from affiliate_report import updater; m=updater.verify_update_manifest_bytes(Path(r'$previousManifest').read_bytes(), Path(r'$previousSignature').read_bytes()); assert m['version'] == '$previousVersion'"
          if ($LASTEXITCODE -ne 0) { throw "Previous latest release does not contain a valid signed rollback feed" }
          try {
            $env:GH_TOKEN = $env:PUBLIC_GH_TOKEN
            gh release edit $tag --repo $repo --draft=false --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not publish public prerelease for anonymous verification" }
            $publicPublished = $true
            $public = gh release view $tag --repo $repo --json isDraft,isPrerelease,tagName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $public.isDraft -or !$public.isPrerelease -or $public.tagName -ne $tag) { throw "Public release publish verification failed" }
            $publicList = gh release list --repo $repo --limit 100 --json tagName,isDraft,isLatest,isPrerelease | ConvertFrom-Json
            $public = @($publicList | Where-Object tagName -eq $tag)
            if ($LASTEXITCODE -ne 0 -or $public.Count -ne 1 -or $public[0].isDraft -or !$public[0].isPrerelease -or $public[0].isLatest) { throw "Public release must be a published prerelease before verification" }

            $releaseVerify = Join-Path $env:RUNNER_TEMP "anonymous-release-verify"
            New-Item -ItemType Directory -Path $releaseVerify -Force | Out-Null
            $env:GH_TOKEN = ""
            $releaseReady = $false
            for ($attempt = 1; $attempt -le 12 -and !$releaseReady; $attempt++) {
              try {
                Remove-Item (Join-Path $releaseVerify "*") -Force -ErrorAction SilentlyContinue
                foreach ($asset in $assetNames) {
                  Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/$tag/$asset" -OutFile (Join-Path $releaseVerify $asset)
                }
                $releaseReady = $true
                foreach ($asset in $assetNames) {
                  $localHash = (Get-FileHash -Algorithm SHA256 (Join-Path "artifacts\installer" $asset)).Hash
                  $publicHash = (Get-FileHash -Algorithm SHA256 (Join-Path $releaseVerify $asset)).Hash
                  if ($localHash -ne $publicHash) { $releaseReady = $false }
                }
              } catch {
                $releaseReady = $false
              }
              if (!$releaseReady) { Start-Sleep -Seconds 5 }
            }
            if (!$releaseReady) { throw "Anonymous public release assets did not become available or match the build" }

            Copy-Item "artifacts\installer\stable.json", "artifacts\installer\stable.json.sig" update-feed\ -Force
            Push-Location update-feed
            git config user.name "github-actions[bot]"
            if ($LASTEXITCODE -ne 0) { throw "Could not configure update-feed git user" }
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ($LASTEXITCODE -ne 0) { throw "Could not configure update-feed git email" }
            git add stable.json stable.json.sig
            if ($LASTEXITCODE -ne 0) { throw "Could not stage public stable feed" }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Public stable feed unchanged."
            } elseif ($LASTEXITCODE -eq 1) {
              git commit -m "Update stable feed $tag"
              if ($LASTEXITCODE -ne 0) { throw "Could not commit public stable feed" }
              $stableCommitted = $true
              $stableCommit = (git rev-parse HEAD).Trim()
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve public stable feed commit" }
              git push
              if ($LASTEXITCODE -ne 0) { throw "Could not push public stable feed" }
            } else {
              throw "Could not inspect public stable feed changes"
            }
            Pop-Location

            $verify = Join-Path $env:RUNNER_TEMP "live-update-verify"
            New-Item -ItemType Directory -Path $verify -Force | Out-Null
            $rawReady = $false
            for ($attempt = 1; $attempt -le 12 -and !$rawReady; $attempt++) {
              try {
                $cacheBust = if ($stableCommit) { $stableCommit } else { [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() }
                Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/$feedRepo/main/stable.json?commit=$cacheBust&attempt=$attempt" -OutFile (Join-Path $verify "stable.json")
                Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/$feedRepo/main/stable.json.sig?commit=$cacheBust&attempt=$attempt" -OutFile (Join-Path $verify "stable.json.sig")
                $rawReady = ((Get-FileHash -Algorithm SHA256 (Join-Path $verify "stable.json")).Hash -eq (Get-FileHash -Algorithm SHA256 "artifacts\installer\stable.json").Hash) -and ((Get-FileHash -Algorithm SHA256 (Join-Path $verify "stable.json.sig")).Hash -eq (Get-FileHash -Algorithm SHA256 "artifacts\installer\stable.json.sig").Hash)
              } catch {
                $rawReady = $false
              }
              if (!$rawReady) { Start-Sleep -Seconds 5 }
            }
            if (!$rawReady) { throw "Live raw feed does not match signed build artifacts" }
            $installerName = "AffiliateReportSetup-v$version.exe"
            $checksumLines = @(Get-Content (Join-Path $releaseVerify "SHA256SUMS.txt"))
            $checksumNames = @($checksumLines | ForEach-Object {
              $match = [regex]::Match($_, '^([A-Fa-f0-9]{64})  (AffiliateReportSetup-v\d+\.\d+\.\d+\.exe|TikTokAffiliateUpdater-v\d+\.\d+\.\d+\.ps1)$')
              if (!$match.Success) { throw "SHA256SUMS contains a malformed or unexpected entry" }
              $match.Groups[2].Value
            } | Sort-Object)
            $expectedChecksumNames = @($installerName, "TikTokAffiliateUpdater-v1.0.0.ps1") | Sort-Object
            if ($checksumLines.Count -ne 2 -or (Compare-Object $checksumNames $expectedChecksumNames)) { throw "SHA256SUMS must contain exactly the installer and updater bootstrap" }
            $installerEntry = @($checksumLines | Where-Object { $_ -match ([regex]::Escape($installerName) + '$') })
            $bootstrapEntry = @($checksumLines | Where-Object { $_ -match 'TikTokAffiliateUpdater-v1\.0\.0\.ps1$' })
            if ($installerEntry.Count -ne 1 -or $bootstrapEntry.Count -ne 1) { throw "SHA256SUMS must contain exactly one installer and one updater bootstrap entry" }
            $expected = ([regex]::Match($installerEntry[0], '^([A-Fa-f0-9]{64})').Groups[1].Value).ToUpperInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $releaseVerify $installerName)).Hash
            if ($actual -ne $expected) { throw "Live release checksum mismatch" }
            $bootstrapExpected = ([regex]::Match($bootstrapEntry[0], '^([A-Fa-f0-9]{64})').Groups[1].Value).ToUpperInvariant()
            $bootstrapActual = (Get-FileHash -Algorithm SHA256 (Join-Path $releaseVerify "TikTokAffiliateUpdater-v1.0.0.ps1")).Hash
            if ($bootstrapActual -ne $bootstrapExpected) { throw "Live updater bootstrap checksum mismatch" }
            .\.venv\Scripts\python.exe -c "from pathlib import Path; import hashlib; from affiliate_report import updater; m=updater.verify_update_manifest_bytes(Path(r'$verify\stable.json').read_bytes(), Path(r'$verify\stable.json.sig').read_bytes()); installer=Path(r'$releaseVerify\AffiliateReportSetup-v$version.exe'); bootstrap=Path(r'$releaseVerify\TikTokAffiliateUpdater-v1.0.0.ps1'); assert m['version'] == '$version'; assert m['release_url'] == 'https://github.com/$repo/releases/tag/$tag'; assert m['installer']['url'] == 'https://github.com/$repo/releases/download/$tag/AffiliateReportSetup-v$version.exe'; assert m['installer']['name'] == installer.name; assert m['installer']['size'] == installer.stat().st_size; assert m['installer']['sha256'] == '$actual'; assert m['bootstrap']['url'] == 'https://github.com/$repo/releases/download/$tag/TikTokAffiliateUpdater-v1.0.0.ps1'; assert m['bootstrap']['name'] == bootstrap.name; assert m['bootstrap']['size'] == bootstrap.stat().st_size; assert m['bootstrap']['sha256'] == hashlib.sha256(bootstrap.read_bytes()).hexdigest().upper()"
            if ($LASTEXITCODE -ne 0) { throw "Live public updater verification failed" }

            # The feed is live and the public release is still a non-latest prerelease. Run five
            # independent, secretless Windows clients through the real in-app Update Now flow.
            $env:GH_TOKEN = $env:PRIVATE_GH_TOKEN
            $releaseSha = "${{ github.sha }}"
            $releaseNonce = [guid]::NewGuid().ToString("N")
            $previousVersion = ([regex]::Match((Get-Content -Raw .github/workflows/windows-updater-ui-smoke.yml), '(?ms)previous_version:.*?default:\s*"([^"]+)"')).Groups[1].Value
            if (-not $previousVersion) { throw "Could not read previous_version default from the updater UI smoke workflow" }
            $smokeTitle = "Public updater UI smoke $previousVersion -> $version ($releaseSha) [$releaseNonce]"
            gh workflow run windows-updater-ui-smoke.yml --ref $tag -f previous_version=$previousVersion -f current_version=$version -f release_sha=$releaseSha -f release_nonce=$releaseNonce
            if ($LASTEXITCODE -ne 0) { throw "Could not dispatch the five-run public updater UI gate" }
            $smokeRun = $null
            for ($attempt = 1; $attempt -le 30 -and !$smokeRun; $attempt++) {
              Start-Sleep -Seconds 5
              $runs = gh run list --workflow windows-updater-ui-smoke.yml --event workflow_dispatch --limit 30 --json databaseId,displayTitle,status,conclusion,headSha | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "Could not query public updater UI gate" }
              $smokeRun = @($runs | Where-Object { $_.displayTitle -eq $smokeTitle -and $_.headSha -eq $releaseSha } | Select-Object -First 1)
            }
            if (!$smokeRun) { throw "Could not locate the dispatched public updater UI gate" }
            $deadline = [DateTimeOffset]::UtcNow.AddMinutes(35)
            do {
              Start-Sleep -Seconds 15
              $smokeRun = gh run view $smokeRun[0].databaseId --json databaseId,status,conclusion,url | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "Could not monitor public updater UI gate" }
            } while ($smokeRun.status -ne "completed" -and [DateTimeOffset]::UtcNow -lt $deadline)
            if ($smokeRun.status -ne "completed" -or $smokeRun.conclusion -ne "success") {
              throw "Public updater UI gate did not pass 5/5: $($smokeRun.url)"
            }
            "Five independent v2.0.6 -> $version Update Now runs passed: $($smokeRun.url)" >> $env:GITHUB_STEP_SUMMARY

            # Một repo duy nhất: bản "riêng" và bản "công khai" là CÙNG một release. Nó vừa được
            # công bố dưới dạng tiền phát hành để gate tải xuống, nên phải gỡ cờ tiền phát hành
            # TRƯỚC rồi mới kiểm — đảo lại thì bước kiểm tự mâu thuẫn với bước ngay trước nó,
            # đúng chỗ v2.0.17 dừng dù gate đã đạt 5/5.
            $env:GH_TOKEN = $env:PUBLIC_GH_TOKEN
            gh release edit $tag --repo $repo --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not mark public release latest" }
            $privatePublished = $true
            $private = gh release view $tag --json isDraft,isPrerelease,tagName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $private.isDraft -or $private.isPrerelease -or $private.tagName -ne $tag) { throw "Private release publish verification failed" }
            $publicList = gh release list --repo $repo --limit 100 --json tagName,isDraft,isLatest,isPrerelease | ConvertFrom-Json
            $public = @($publicList | Where-Object tagName -eq $tag)
            if ($LASTEXITCODE -ne 0 -or $public.Count -ne 1 -or $public[0].isDraft -or $public[0].isPrerelease -or !$public[0].isLatest) { throw "Public release latest verification failed" }
          } catch {
            $failure = $_
            if ((Split-Path -Leaf (Get-Location)) -eq "update-feed") { Pop-Location }
            $rollbackErrors = [System.Collections.Generic.List[string]]::new()
            try {
              Push-Location update-feed
              git fetch origin main
              if ($LASTEXITCODE -ne 0) { throw "Could not fetch the public feed before rollback" }
              git reset --hard origin/main
              if ($LASTEXITCODE -ne 0) { throw "Could not reset the public feed checkout before rollback" }
              Copy-Item $previousManifest, $previousSignature . -Force
              git add stable.json stable.json.sig
              if ($LASTEXITCODE -ne 0) { throw "Could not stage the previous signed feed" }
              git diff --cached --quiet
              if ($LASTEXITCODE -eq 1) {
                git commit -m "Rollback stable feed from $tag to $previousLatestTag"
                if ($LASTEXITCODE -ne 0) { throw "Could not commit the previous signed feed" }
              } elseif ($LASTEXITCODE -ne 0) {
                throw "Could not inspect the feed rollback"
              }
              git push
              if ($LASTEXITCODE -ne 0) { throw "Could not push the public stable feed rollback" }
              $rollbackCommit = (git rev-parse HEAD).Trim()
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve the public feed rollback commit" }
              Pop-Location
            } catch {
              if ((Split-Path -Leaf (Get-Location)) -eq "update-feed") { Pop-Location }
              $rollbackErrors.Add("feed restore: $($_.Exception.Message)")
            }

            try {
              $env:GH_TOKEN = $env:PRIVATE_GH_TOKEN
              $privateRollback = gh release view $tag --json isDraft 2>$null | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "Could not read private release state during rollback" }
              if (!$privateRollback.isDraft) {
                gh release edit $tag --draft=true
                if ($LASTEXITCODE -ne 0) { throw "Could not return private release to draft" }
              }
              $privateRollback = gh release view $tag --json isDraft | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or !$privateRollback.isDraft) { throw "Private release rollback verification failed" }
            } catch {
              $rollbackErrors.Add("private release: $($_.Exception.Message)")
            }

            try {
              $env:GH_TOKEN = $env:PUBLIC_GH_TOKEN
              $publicRollback = gh release view $tag --repo $repo --json isDraft 2>$null | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "Could not read public release state during rollback" }
              if (!$publicRollback.isDraft) {
                gh release edit $tag --repo $repo --draft=true --prerelease=false
                if ($LASTEXITCODE -ne 0) { throw "Could not return public release to draft" }
              }
              $publicRollback = gh release view $tag --repo $repo --json isDraft | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or !$publicRollback.isDraft) { throw "Public release rollback verification failed" }
              gh release edit $previousLatestTag --repo $repo --latest
              if ($LASTEXITCODE -ne 0) { throw "Could not restore the previous public latest release" }
              $publicAfterRollback = gh release list --repo $repo --limit 100 --json tagName,isDraft,isLatest,isPrerelease | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "Could not verify the previous public latest release after rollback" }
              $latestAfterRollback = @($publicAfterRollback | Where-Object { $_.isLatest -and !$_.isDraft })
              if ($latestAfterRollback.Count -ne 1 -or $latestAfterRollback[0].tagName -ne $previousLatestTag) { throw "Previous public latest release was not restored" }
            } catch {
              $rollbackErrors.Add("public release: $($_.Exception.Message)")
            }

            try {
              $rollbackVerify = Join-Path $env:RUNNER_TEMP "rollback-feed-verify"
              New-Item -ItemType Directory -Path $rollbackVerify -Force | Out-Null
              $rollbackReady = $false
              for ($attempt = 1; $attempt -le 12 -and !$rollbackReady; $attempt++) {
                try {
                  Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/$feedRepo/main/stable.json?rollback=$rollbackCommit&attempt=$attempt" -OutFile (Join-Path $rollbackVerify "stable.json")
                  Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/$feedRepo/main/stable.json.sig?rollback=$rollbackCommit&attempt=$attempt" -OutFile (Join-Path $rollbackVerify "stable.json.sig")
                  $rollbackReady = ((Get-FileHash -Algorithm SHA256 (Join-Path $rollbackVerify "stable.json")).Hash -eq $previousManifestHash) -and ((Get-FileHash -Algorithm SHA256 (Join-Path $rollbackVerify "stable.json.sig")).Hash -eq $previousSignatureHash)
                } catch {
                  $rollbackReady = $false
                }
                if (!$rollbackReady) { Start-Sleep -Seconds 5 }
              }
              if (!$rollbackReady) { throw "Live raw feed rollback verification failed" }
            } catch {
              $rollbackErrors.Add("live feed verification: $($_.Exception.Message)")
            }

            if ($rollbackErrors.Count -gt 0) {
              throw "Release failed: $($failure.Exception.Message). Rollback also failed: $($rollbackErrors -join '; ')"
            }
            throw $failure
          }
