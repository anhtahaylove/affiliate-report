name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: tiktok_affiliate_report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiktok_affiliate_report_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tiktok_affiliate_report_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Verify API, migration and web
        run: |
          python -m pip install --disable-pip-version-check -r requirements-api.txt
          python -m pytest -q
          python -m compileall -q tiktok_affiliate_report scripts tests desktop_launcher.py
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web lint
          pnpm --dir web exec tsc --noEmit --pretty false
          pnpm --dir web build
          pnpm --dir web audit --prod

  windows-installer:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install build tools
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-api.txt "pyinstaller==6.21.0"
          choco install innosetup --no-progress -y
      - name: Verify version and tests
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $appVersion = & .\.venv\Scripts\python.exe -c "from tiktok_affiliate_report.version import APP_VERSION; print(APP_VERSION)"
          if ($appVersion -ne $version) { throw "Tag $version does not match APP_VERSION $appVersion" }
          .\.venv\Scripts\python.exe -m pytest -q
          .\.venv\Scripts\python.exe -m compileall -q tiktok_affiliate_report scripts tests desktop_launcher.py
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web lint
          pnpm --dir web exec tsc --noEmit --pretty false
          pnpm --dir web audit --prod
      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          .\packaging\build_installer.ps1 -AppVersion $version
      - name: Sign public update feed
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $repo = "anhtahaylove/tiktok-affiliate-report-updates"
          $keyId = "tiktok-report-updates-2026-08"
          $publicKey = .\.venv\Scripts\python.exe -m scripts.sign_update_feed --version $version --installer "artifacts\installer\TikTokAffiliateReportSetup-v$version.exe" --asset-url "https://github.com/$repo/releases/download/$tag/TikTokAffiliateReportSetup-v$version.exe" --release-url "https://github.com/$repo/releases/tag/$tag" --key-id $keyId --output-dir "artifacts\installer" --print-public-key | Select-Object -First 1
          $pinned = .\.venv\Scripts\python.exe -c "from tiktok_affiliate_report.updater import TRUSTED_UPDATE_KEYS; print(TRUSTED_UPDATE_KEYS['$keyId'])"
          if ($publicKey -ne $pinned) { throw "UPDATE_SIGNING_KEY_B64 does not match pinned updater public key" }
      - name: Create verified private release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $installer = "artifacts\installer\TikTokAffiliateReportSetup-v$version.exe"
          $existingJson = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (!$existing.isDraft) { throw "Private release $tag is already published" }
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not replace existing private draft release" }
          }
          gh release create $tag $installer "artifacts\installer\SHA256SUMS.txt" "artifacts\installer\stable.json" "artifacts\installer\stable.json.sig" --draft --generate-notes --title "TikTok Affiliate Report $tag" --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "Could not create private draft release" }
          $draft = gh release view $tag --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$draft.isDraft -or $draft.isPrerelease -or $draft.tagName -ne $tag) { throw "Private release draft verification failed" }
      - name: Verify private draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $verify = Join-Path $env:RUNNER_TEMP "release-verify"
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $tag --dir $verify
          if ($LASTEXITCODE -ne 0) { throw "Could not download private draft release" }
          $actualFiles = @(Get-ChildItem -LiteralPath $verify -File | ForEach-Object Name | Sort-Object)
          $expectedFiles = @("SHA256SUMS.txt", "TikTokAffiliateReportSetup-v$version.exe", "stable.json", "stable.json.sig") | Sort-Object
          if (Compare-Object $actualFiles $expectedFiles) { throw "Release must contain exactly installer, SHA256SUMS.txt, stable.json and stable.json.sig" }
          $expected = ((Get-Content (Join-Path $verify "SHA256SUMS.txt") -Raw) -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $verify "TikTokAffiliateReportSetup-v$version.exe")).Hash
          if ($actual -ne $expected) { throw "Downloaded release checksum mismatch" }
          $draft = gh release view $tag --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$draft.isDraft -or $draft.isPrerelease -or $draft.tagName -ne $tag) { throw "Private release verification failed" }
      - name: Create and verify public update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_FEED_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $repo = "anhtahaylove/tiktok-affiliate-report-updates"
          $assets = @("artifacts\installer\TikTokAffiliateReportSetup-v$version.exe", "artifacts\installer\SHA256SUMS.txt", "artifacts\installer\stable.json", "artifacts\installer\stable.json.sig")
          $existingJson = gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (!$existing.isDraft) { throw "Public release $tag is already published" }
            gh release delete $tag --repo $repo --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not replace existing public draft release" }
          }
          gh release create $tag @assets --repo $repo --draft --latest=false --title "TikTok Affiliate Report $tag" --notes "Public auto-update feed for $tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not create public draft release" }
          $verify = Join-Path $env:RUNNER_TEMP "public-release-verify"
          New-Item -ItemType Directory -Path $verify -Force | Out-Null
          gh release download $tag --repo $repo --dir $verify
          if ($LASTEXITCODE -ne 0) { throw "Could not download public draft release" }
          $actualFiles = @(Get-ChildItem -LiteralPath $verify -File | ForEach-Object Name | Sort-Object)
          $expectedFiles = @("SHA256SUMS.txt", "TikTokAffiliateReportSetup-v$version.exe", "stable.json", "stable.json.sig") | Sort-Object
          if (Compare-Object $actualFiles $expectedFiles) { throw "Public mirror must contain exactly four verified assets" }
          $expected = ((Get-Content (Join-Path $verify "SHA256SUMS.txt") -Raw) -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $verify "TikTokAffiliateReportSetup-v$version.exe")).Hash
          if ($actual -ne $expected) { throw "Public mirror checksum mismatch" }
          .\.venv\Scripts\python.exe -c "from pathlib import Path; from tiktok_affiliate_report import updater; m=updater.verify_update_manifest_bytes(Path(r'$verify\stable.json').read_bytes(), Path(r'$verify\stable.json.sig').read_bytes()); installer=Path(r'$verify\TikTokAffiliateReportSetup-v$version.exe'); assert m['version'] == '$version'; assert m['release_url'] == 'https://github.com/$repo/releases/tag/$tag'; assert m['installer']['url'] == 'https://github.com/$repo/releases/download/$tag/TikTokAffiliateReportSetup-v$version.exe'; assert m['installer']['name'] == installer.name; assert m['installer']['size'] == installer.stat().st_size; assert m['installer']['sha256'] == '$actual'"
          if ($LASTEXITCODE -ne 0) { throw "Public draft manifest verification failed" }
          $draft = gh release view $tag --repo $repo --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$draft.isDraft -or $draft.isPrerelease -or $draft.tagName -ne $tag) { throw "Public release verification failed" }
      - uses: actions/checkout@v4
        with:
          repository: anhtahaylove/tiktok-affiliate-report-updates
          token: ${{ secrets.UPDATE_FEED_TOKEN }}
          path: update-feed
      - name: Promote public stable feed and releases
        shell: pwsh
        env:
          PRIVATE_GH_TOKEN: ${{ github.token }}
          PUBLIC_GH_TOKEN: ${{ secrets.UPDATE_FEED_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $repo = "anhtahaylove/tiktok-affiliate-report-updates"
          $assetNames = @("SHA256SUMS.txt", "TikTokAffiliateReportSetup-v$version.exe", "stable.json", "stable.json.sig")
          $stableCommitted = $false
          $stableCommit = ""
          $publicPublished = $false
          $privatePublished = $false
          try {
            $env:GH_TOKEN = $env:PUBLIC_GH_TOKEN
            gh release edit $tag --repo $repo --draft=false --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not publish public prerelease for anonymous verification" }
            $publicPublished = $true
            $public = gh release view $tag --repo $repo --json isDraft,isPrerelease,tagName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $public.isDraft -or !$public.isPrerelease -or $public.tagName -ne $tag) { throw "Public release publish verification failed" }
            $publicList = gh release list --repo $repo --limit 100 --json tagName,isDraft,isLatest,isPrerelease | ConvertFrom-Json
            $public = @($publicList | Where-Object tagName -eq $tag)
            if ($LASTEXITCODE -ne 0 -or $public.Count -ne 1 -or $public[0].isDraft -or !$public[0].isPrerelease -or $public[0].isLatest) { throw "Public release must be a published prerelease before verification" }

            $releaseVerify = Join-Path $env:RUNNER_TEMP "anonymous-release-verify"
            New-Item -ItemType Directory -Path $releaseVerify -Force | Out-Null
            $env:GH_TOKEN = ""
            $releaseReady = $false
            for ($attempt = 1; $attempt -le 12 -and !$releaseReady; $attempt++) {
              try {
                Remove-Item (Join-Path $releaseVerify "*") -Force -ErrorAction SilentlyContinue
                foreach ($asset in $assetNames) {
                  Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/$tag/$asset" -OutFile (Join-Path $releaseVerify $asset)
                }
                $releaseReady = $true
                foreach ($asset in $assetNames) {
                  $localHash = (Get-FileHash -Algorithm SHA256 (Join-Path "artifacts\installer" $asset)).Hash
                  $publicHash = (Get-FileHash -Algorithm SHA256 (Join-Path $releaseVerify $asset)).Hash
                  if ($localHash -ne $publicHash) { $releaseReady = $false }
                }
              } catch {
                $releaseReady = $false
              }
              if (!$releaseReady) { Start-Sleep -Seconds 5 }
            }
            if (!$releaseReady) { throw "Anonymous public release assets did not become available or match the build" }

            Copy-Item "artifacts\installer\stable.json", "artifacts\installer\stable.json.sig" update-feed\ -Force
            Push-Location update-feed
            git config user.name "github-actions[bot]"
            if ($LASTEXITCODE -ne 0) { throw "Could not configure update-feed git user" }
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ($LASTEXITCODE -ne 0) { throw "Could not configure update-feed git email" }
            git add stable.json stable.json.sig
            if ($LASTEXITCODE -ne 0) { throw "Could not stage public stable feed" }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Public stable feed unchanged."
            } elseif ($LASTEXITCODE -eq 1) {
              git commit -m "Update stable feed $tag"
              if ($LASTEXITCODE -ne 0) { throw "Could not commit public stable feed" }
              $stableCommitted = $true
              $stableCommit = (git rev-parse HEAD).Trim()
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve public stable feed commit" }
              git push
              if ($LASTEXITCODE -ne 0) { throw "Could not push public stable feed" }
            } else {
              throw "Could not inspect public stable feed changes"
            }
            Pop-Location

            $verify = Join-Path $env:RUNNER_TEMP "live-update-verify"
            New-Item -ItemType Directory -Path $verify -Force | Out-Null
            $rawReady = $false
            for ($attempt = 1; $attempt -le 12 -and !$rawReady; $attempt++) {
              try {
                $cacheBust = if ($stableCommit) { $stableCommit } else { [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() }
                Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/$repo/main/stable.json?commit=$cacheBust&attempt=$attempt" -OutFile (Join-Path $verify "stable.json")
                Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/$repo/main/stable.json.sig?commit=$cacheBust&attempt=$attempt" -OutFile (Join-Path $verify "stable.json.sig")
                $rawReady = ((Get-FileHash -Algorithm SHA256 (Join-Path $verify "stable.json")).Hash -eq (Get-FileHash -Algorithm SHA256 "artifacts\installer\stable.json").Hash) -and ((Get-FileHash -Algorithm SHA256 (Join-Path $verify "stable.json.sig")).Hash -eq (Get-FileHash -Algorithm SHA256 "artifacts\installer\stable.json.sig").Hash)
              } catch {
                $rawReady = $false
              }
              if (!$rawReady) { Start-Sleep -Seconds 5 }
            }
            if (!$rawReady) { throw "Live raw feed does not match signed build artifacts" }
            $expected = ((Get-Content (Join-Path $releaseVerify "SHA256SUMS.txt") -Raw) -split '\s+')[0].ToUpperInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $releaseVerify "TikTokAffiliateReportSetup-v$version.exe")).Hash
            if ($actual -ne $expected) { throw "Live release checksum mismatch" }
            .\.venv\Scripts\python.exe -c "from pathlib import Path; from tiktok_affiliate_report import updater; m=updater.verify_update_manifest_bytes(Path(r'$verify\stable.json').read_bytes(), Path(r'$verify\stable.json.sig').read_bytes()); installer=Path(r'$releaseVerify\TikTokAffiliateReportSetup-v$version.exe'); assert m['version'] == '$version'; assert m['release_url'] == 'https://github.com/$repo/releases/tag/$tag'; assert m['installer']['url'] == 'https://github.com/$repo/releases/download/$tag/TikTokAffiliateReportSetup-v$version.exe'; assert m['installer']['name'] == installer.name; assert m['installer']['size'] == installer.stat().st_size; assert m['installer']['sha256'] == '$actual'"
            if ($LASTEXITCODE -ne 0) { throw "Live public updater verification failed" }

            $env:GH_TOKEN = $env:PRIVATE_GH_TOKEN
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw "Could not publish private release" }
            $privatePublished = $true
            $private = gh release view $tag --json isDraft,isPrerelease,tagName | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $private.isDraft -or $private.isPrerelease -or $private.tagName -ne $tag) { throw "Private release publish verification failed" }
            $env:GH_TOKEN = $env:PUBLIC_GH_TOKEN
            gh release edit $tag --repo $repo --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not mark public release latest" }
            $publicList = gh release list --repo $repo --limit 100 --json tagName,isDraft,isLatest,isPrerelease | ConvertFrom-Json
            $public = @($publicList | Where-Object tagName -eq $tag)
            if ($LASTEXITCODE -ne 0 -or $public.Count -ne 1 -or $public[0].isDraft -or $public[0].isPrerelease -or !$public[0].isLatest) { throw "Public release latest verification failed" }
          } catch {
            $failure = $_
            if ((Split-Path -Leaf (Get-Location)) -eq "update-feed") { Pop-Location }
            if ($stableCommitted) {
              Push-Location update-feed
              git revert --no-edit $stableCommit
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not revert public stable feed commit $stableCommit" }
              git push
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not push public stable feed rollback" }
              Pop-Location
            }
            if ($privatePublished) {
              $env:GH_TOKEN = $env:PRIVATE_GH_TOKEN
              gh release edit $tag --draft=true
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not return private release to draft" }
            }
            if ($publicPublished) {
              $env:GH_TOKEN = $env:PUBLIC_GH_TOKEN
              gh release edit $tag --repo $repo --draft=true --prerelease=false
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not return public release to draft" }
            }
            throw $failure
          }
