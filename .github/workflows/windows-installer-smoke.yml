name: Windows installer smoke

on:
  workflow_dispatch:
    inputs:
      current_version:
        description: Current public installer version to smoke test
        required: true
        default: "1.2.11"
      previous_version:
        description: Previous public installer version used for upgrade smoke
        required: true
        default: "1.2.10"
  pull_request:
    paths:
      - ".github/workflows/windows-installer-smoke.yml"
      - "scripts/ci/windows_installer_smoke.ps1"
      - "tests/test_packaging_contract.py"

permissions:
  contents: read

jobs:
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest
      - name: Run packaging contract checks
        run: python -m pytest tests/test_packaging_contract.py -q

  fresh-install:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CURRENT_VERSION: ${{ inputs.current_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Download current public installer and checksums
        shell: pwsh
        run: |
          $repo = "anhtahaylove/tiktok-affiliate-report-updates"
          $currentVersion = $env:CURRENT_VERSION
          if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid current_version: $currentVersion" }
          $installer = Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$currentVersion.exe"
          $checksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-current.txt"
          Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/v$currentVersion/TikTokAffiliateReportSetup-v$currentVersion.exe" -OutFile $installer
          Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/v$currentVersion/SHA256SUMS.txt" -OutFile $checksums
      - name: Smoke fresh install
        shell: pwsh
        run: |
          $currentVersion = $env:CURRENT_VERSION
          .\scripts\ci\windows_installer_smoke.ps1 -Mode Fresh `
            -CurrentInstaller (Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$currentVersion.exe") `
            -CurrentVersion $currentVersion `
            -CurrentChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-current.txt")

  upgrade-install:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CURRENT_VERSION: ${{ inputs.current_version }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Download current and previous public installers and checksums
        shell: pwsh
        run: |
          $repo = "anhtahaylove/tiktok-affiliate-report-updates"
          $currentVersion = $env:CURRENT_VERSION
          $previousVersion = $env:PREVIOUS_VERSION
          if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid current_version: $currentVersion" }
          if ($previousVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid previous_version: $previousVersion" }
          if ([version]$previousVersion -ge [version]$currentVersion) { throw "previous_version must be lower than current_version" }
          $currentInstaller = Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$currentVersion.exe"
          $previousInstaller = Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$previousVersion.exe"
          $currentChecksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-current.txt"
          $previousChecksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-previous.txt"
          Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/v$currentVersion/TikTokAffiliateReportSetup-v$currentVersion.exe" -OutFile $currentInstaller
          Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/v$currentVersion/SHA256SUMS.txt" -OutFile $currentChecksums
          Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/v$previousVersion/TikTokAffiliateReportSetup-v$previousVersion.exe" -OutFile $previousInstaller
          Invoke-WebRequest -UseBasicParsing "https://github.com/$repo/releases/download/v$previousVersion/SHA256SUMS.txt" -OutFile $previousChecksums
      - name: Smoke upgrade and data preservation
        shell: pwsh
        run: |
          $currentVersion = $env:CURRENT_VERSION
          $previousVersion = $env:PREVIOUS_VERSION
          .\scripts\ci\windows_installer_smoke.ps1 -Mode Upgrade `
            -CurrentInstaller (Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$currentVersion.exe") `
            -CurrentVersion $currentVersion `
            -CurrentChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-current.txt") `
            -PreviousInstaller (Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$previousVersion.exe") `
            -PreviousVersion $previousVersion `
            -PreviousChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-previous.txt")
