name: Windows installer smoke

on:
  workflow_dispatch:
    inputs:
      current_version:
        description: Current public installer version to smoke test
        required: true
        default: "2.0.28"
      previous_version:
        description: Previous public installer version used for upgrade smoke
        required: true
        default: "2.0.25"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer-smoke.yml"
      - ".gitattributes"
      - "affiliate_report/**"
      - "web/**"
      - "packaging/**"
      - "scripts/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "BUILD_EXE.bat"
      - "desktop_launcher.py"
      - "run_api.py"
      - "README.md"
      - "CHANGELOG.md"
      - "tests/test_packaging_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer-smoke.yml"
      - ".gitattributes"
      - "affiliate_report/**"
      - "web/**"
      - "packaging/**"
      - "scripts/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "BUILD_EXE.bat"
      - "desktop_launcher.py"
      - "run_api.py"
      - "CHANGELOG.md"
      - "tests/test_packaging_contract.py"

permissions:
  contents: read

env:
  PUBLIC_UPDATE_REPO: anhtahaylove/affiliate-report
  PREVIOUS_STABLE_VERSION: "2.0.6"
  CANDIDATE_ARTIFACT_NAME: v207-candidate-installer

jobs:
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pytest
      - name: Run packaging contract checks
        run: python -m pytest tests/test_packaging_contract.py -q

  same-repo-candidate-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require an unprivileged same-repository candidate
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Fork pull requests cannot run installer candidates. A maintainer must place the reviewed commit on a same-repository branch before merge."
            exit 1
          fi

  candidate-build:
    if: >-
      always() && needs.contract-checks.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.same-repo-candidate-gate.result == 'success'))
    needs: [contract-checks, same-repo-candidate-gate]
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      current_version: ${{ steps.candidate.outputs.current_version }}
      installer_sha256: ${{ steps.candidate.outputs.installer_sha256 }}
      installer_size: ${{ steps.candidate.outputs.installer_size }}
      merge_sha: ${{ steps.candidate.outputs.merge_sha }}
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Windows build tools
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements-api.txt "pyinstaller==6.21.0"
          choco install innosetup --no-progress -y
      - name: Verify exact PR merge candidate and canonical version
        id: version
        shell: pwsh
        run: |
          $actualSha = git rev-parse HEAD
          if ($actualSha -ne $env:EXPECTED_SHA) { throw "Candidate checkout does not match PR merge SHA: $actualSha" }
          $currentVersion = & .\.venv\Scripts\python.exe -c "from affiliate_report.version import APP_VERSION; print(APP_VERSION)"
          if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid canonical candidate version: $currentVersion" }
          if ([version]$env:PREVIOUS_STABLE_VERSION -ge [version]$currentVersion) { throw "previous_version must be lower than current_version" }
          "current_version=$currentVersion" >> $env:GITHUB_OUTPUT
      - name: Run exact-head Windows updater helper runtime tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pytest tests/test_updater.py tests/test_updater_diagnostics.py -q
      - name: Build candidate installer
        shell: pwsh
        run: |
          .\packaging\build_installer.ps1 -AppVersion "${{ steps.version.outputs.current_version }}"
      - name: Verify candidate privacy and artifact allowlist
        id: candidate
        shell: pwsh
        run: |
          $currentVersion = "${{ steps.version.outputs.current_version }}"
          $installer = "artifacts\installer\AffiliateReportSetup-v$currentVersion.exe"
          $checksum = "artifacts\installer\SHA256SUMS.txt"
          .\packaging\assert_no_embedded_database.ps1 -Path "build\installer-app\AffiliateReport"
          $bootstrap = "artifacts\installer\TikTokAffiliateUpdater-v1.0.0.ps1"
          $actualFiles = @(Get-ChildItem -LiteralPath "artifacts\installer" -File | ForEach-Object Name | Sort-Object)
          $expectedFiles = @("SHA256SUMS.txt", "AffiliateReportSetup-v$currentVersion.exe", "TikTokAffiliateUpdater-v1.0.0.ps1") | Sort-Object
          if (Compare-Object $actualFiles $expectedFiles) { throw "Candidate artifact directory must contain only installer, updater bootstrap and SHA256SUMS.txt" }
          $checksumLines = @(Get-Content -LiteralPath $checksum | Where-Object { $_.Trim() })
          $checksumNames = @($checksumLines | ForEach-Object {
            $match = [regex]::Match($_, '^([A-Fa-f0-9]{64})  (AffiliateReportSetup-v\d+\.\d+\.\d+\.exe|TikTokAffiliateUpdater-v\d+\.\d+\.\d+\.ps1)$')
            if (!$match.Success) { throw "Candidate SHA256SUMS contains a malformed or unexpected entry" }
            $match.Groups[2].Value
          } | Sort-Object)
          $expectedChecksumNames = @("AffiliateReportSetup-v$currentVersion.exe", "TikTokAffiliateUpdater-v1.0.0.ps1") | Sort-Object
          if ($checksumLines.Count -ne 2 -or (Compare-Object $checksumNames $expectedChecksumNames)) { throw "Candidate SHA256SUMS must contain exactly the installer and updater bootstrap" }
          $installerLine = @(Get-Content -LiteralPath $checksum | Where-Object { $_ -match ([regex]::Escape("AffiliateReportSetup-v$currentVersion.exe") + '$') })
          if ($installerLine.Count -ne 1) { throw "Candidate installer checksum entry is missing" }
          $expectedHash = ([regex]::Match($installerLine[0], '^([A-Fa-f0-9]{64})').Groups[1].Value).ToUpperInvariant()
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "Candidate installer checksum mismatch" }
          $bootstrapLine = @(Get-Content -LiteralPath $checksum | Where-Object { $_ -match 'TikTokAffiliateUpdater-v1\.0\.0\.ps1$' })
          if ($bootstrapLine.Count -ne 1) { throw "Candidate bootstrap checksum entry is missing" }
          $bootstrapExpected = ([regex]::Match($bootstrapLine[0], '^([A-Fa-f0-9]{64})').Groups[1].Value).ToUpperInvariant()
          $bootstrapActual = (Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash
          if ($bootstrapActual -ne $bootstrapExpected) { throw "Candidate bootstrap checksum mismatch" }
          $size = (Get-Item -LiteralPath $installer).Length
          $mergeSha = git rev-parse HEAD
          "current_version=$currentVersion" >> $env:GITHUB_OUTPUT
          "installer_sha256=$actualHash" >> $env:GITHUB_OUTPUT
          "installer_size=$size" >> $env:GITHUB_OUTPUT
          "merge_sha=$mergeSha" >> $env:GITHUB_OUTPUT
          @"
          ## Candidate installer
          - Version: `$currentVersion`
          - PR merge SHA: `$mergeSha`
          - Size: `$size` bytes
          - SHA-256: `$actualHash`
          "@ >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: |
            artifacts/installer/AffiliateReportSetup-v*.exe
            artifacts/installer/TikTokAffiliateUpdater-v1.0.0.ps1
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

  candidate-fresh-install:
    if: always() && needs.candidate-build.result == 'success'
    needs: candidate-build
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: candidate
      - name: Smoke candidate fresh install
        shell: pwsh
        run: |
          $currentVersion = "${{ needs.candidate-build.outputs.current_version }}"
          .\scripts\ci\windows_installer_smoke.ps1 -Mode Fresh `
            -CurrentInstaller (Join-Path $PWD "candidate\AffiliateReportSetup-v$currentVersion.exe") `
            -CurrentVersion $currentVersion `
            -CurrentChecksumFile (Join-Path $PWD "candidate\SHA256SUMS.txt")
          "- Fresh install: PASS" >> $env:GITHUB_STEP_SUMMARY

  candidate-upgrade-install:
    if: always() && needs.candidate-build.result == 'success'
    needs: candidate-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: candidate
      - name: Download previous public installer and checksum
        shell: pwsh
        run: |
          $previousVersion = $env:PREVIOUS_STABLE_VERSION
          $previousChecksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-previous.txt"
          # Nhiều job của lane này chạy song song và cùng kéo tệp 46 MB từ cùng một release,
          # nên GitHub trả 503 cho vài job là chuyện sẽ xảy ra. Tải một phát không thử lại biến
          # chuyện đó thành gate đỏ. Đây là chỗ yếu của bộ kiểm thử, không phải của sản phẩm.
          function Get-PublicAsset([string]$Url, [string]$OutFile) {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing $Url -OutFile $OutFile
                if ((Get-Item -LiteralPath $OutFile).Length -gt 0) { return }
                throw "Empty download"
              } catch {
                if ($attempt -eq 6) { throw "Could not download $Url after 6 attempts: $($_.Exception.Message)" }
                Start-Sleep -Seconds ([Math]::Min(30, [Math]::Pow(2, $attempt)))
              }
            }
          }
          # Bản trước có thể đã phát hành TRƯỚC khi đổi tên, nên asset của nó mang tên cũ.
          # windows_installer_smoke.ps1 so tên tệp cục bộ với dòng trong SHA256SUMS.txt nên phải
          # giữ đúng tên gốc. Thử tên mới trước, không có thì lùi về tên cũ — cùng nguyên tắc
          # chuyển tiếp mà bản cài trên máy người dùng đang dùng.
          function Get-PreviousInstaller([string]$Repo, [string]$Version) {
            foreach ($name in @("AffiliateReportSetup-v$Version.exe", "TikTokAffiliateReportSetup-v$Version.exe")) {
              $dich = Join-Path $env:RUNNER_TEMP $name
              try {
                Get-PublicAsset "https://github.com/$Repo/releases/download/v$Version/$name" $dich
                Write-Host "Previous installer asset: $name"
                return $dich
              } catch {
                Write-Host "Khong co asset $name, thu ten tiep theo"
              }
            }
            throw "Khong tim thay installer cua v$Version duoi bat ky ten nao"
          }
          $previousInstaller = Get-PreviousInstaller $env:PUBLIC_UPDATE_REPO $previousVersion
          "PREVIOUS_INSTALLER=$previousInstaller" >> $env:GITHUB_ENV
          Get-PublicAsset "https://github.com/$env:PUBLIC_UPDATE_REPO/releases/download/v$previousVersion/SHA256SUMS.txt" $previousChecksums
      - name: Smoke candidate upgrade and data preservation
        shell: pwsh
        run: |
          $currentVersion = "${{ needs.candidate-build.outputs.current_version }}"
          $previousVersion = $env:PREVIOUS_STABLE_VERSION
          .\scripts\ci\windows_installer_smoke.ps1 -Mode Upgrade `
            -CurrentInstaller (Join-Path $PWD "candidate\AffiliateReportSetup-v$currentVersion.exe") `
            -CurrentVersion $currentVersion `
            -CurrentChecksumFile (Join-Path $PWD "candidate\SHA256SUMS.txt") `
            -PreviousInstaller $env:PREVIOUS_INSTALLER `
            -PreviousVersion $previousVersion `
            -PreviousChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-previous.txt")
          "- Upgrade $previousVersion -> ${currentVersion}: PASS" >> $env:GITHUB_STEP_SUMMARY

  candidate-bootstrap-runtime:
    if: always() && needs.candidate-build.result == 'success'
    needs: candidate-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: candidate
      - name: Smoke packaged independent bootstrap success path
        shell: pwsh
        run: |
          $currentVersion = "${{ needs.candidate-build.outputs.current_version }}"
          .\scripts\ci\windows_installer_smoke.ps1 -Mode Bootstrap `
            -CurrentInstaller (Join-Path $PWD "candidate\AffiliateReportSetup-v$currentVersion.exe") `
            -CurrentVersion $currentVersion `
            -CurrentChecksumFile (Join-Path $PWD "candidate\SHA256SUMS.txt") `
            -BootstrapPath (Join-Path $PWD "candidate\TikTokAffiliateUpdater-v1.0.0.ps1")
          "- Packaged bootstrap runtime: PASS" >> $env:GITHUB_STEP_SUMMARY

  candidate-release-gate:
    if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [candidate-build, candidate-fresh-install, candidate-upgrade-install, candidate-bootstrap-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Require build, fresh and upgrade evidence
        env:
          BUILD_RESULT: ${{ needs.candidate-build.result }}
          FRESH_RESULT: ${{ needs.candidate-fresh-install.result }}
          UPGRADE_RESULT: ${{ needs.candidate-upgrade-install.result }}
          BOOTSTRAP_RESULT: ${{ needs.candidate-bootstrap-runtime.result }}
          VERSION: ${{ needs.candidate-build.outputs.current_version }}
          MERGE_SHA: ${{ needs.candidate-build.outputs.merge_sha }}
          INSTALLER_SIZE: ${{ needs.candidate-build.outputs.installer_size }}
          INSTALLER_SHA256: ${{ needs.candidate-build.outputs.installer_sha256 }}
        run: |
          if [ "$BUILD_RESULT" != "success" ] || [ "$FRESH_RESULT" != "success" ] || [ "$UPGRADE_RESULT" != "success" ] || [ "$BOOTSTRAP_RESULT" != "success" ]; then
            echo "::error::Candidate build, fresh, upgrade and packaged bootstrap runtime smokes must all pass before merge."
            exit 1
          fi
          {
            echo "## Release candidate gate"
            echo "- Version: $VERSION"
            echo "- Smoked commit SHA: $MERGE_SHA"
            echo "- Installer size: $INSTALLER_SIZE bytes"
            echo "- SHA-256: $INSTALLER_SHA256"
            echo "- Fresh: PASS"
            echo "- Upgrade: PASS"
            echo "- Packaged bootstrap runtime: PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  fresh-install:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-checks
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CURRENT_VERSION: ${{ inputs.current_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Download current public installer and checksums
        shell: pwsh
        run: |
          $currentVersion = $env:CURRENT_VERSION
          if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid current_version: $currentVersion" }
          $installer = Join-Path $env:RUNNER_TEMP "AffiliateReportSetup-v$currentVersion.exe"
          $checksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-current.txt"
          # Nhiều job của lane này chạy song song và cùng kéo tệp 46 MB từ cùng một release,
          # nên GitHub trả 503 cho vài job là chuyện sẽ xảy ra. Tải một phát không thử lại biến
          # chuyện đó thành gate đỏ. Đây là chỗ yếu của bộ kiểm thử, không phải của sản phẩm.
          function Get-PublicAsset([string]$Url, [string]$OutFile) {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing $Url -OutFile $OutFile
                if ((Get-Item -LiteralPath $OutFile).Length -gt 0) { return }
                throw "Empty download"
              } catch {
                if ($attempt -eq 6) { throw "Could not download $Url after 6 attempts: $($_.Exception.Message)" }
                Start-Sleep -Seconds ([Math]::Min(30, [Math]::Pow(2, $attempt)))
              }
            }
          }
          Get-PublicAsset "https://github.com/$env:PUBLIC_UPDATE_REPO/releases/download/v$currentVersion/AffiliateReportSetup-v$currentVersion.exe" $installer
          Get-PublicAsset "https://github.com/$env:PUBLIC_UPDATE_REPO/releases/download/v$currentVersion/SHA256SUMS.txt" $checksums
      - name: Smoke fresh install
        shell: pwsh
        run: |
          $currentVersion = $env:CURRENT_VERSION
          .\scripts\ci\windows_installer_smoke.ps1 -Mode Fresh `
            -CurrentInstaller (Join-Path $env:RUNNER_TEMP "AffiliateReportSetup-v$currentVersion.exe") `
            -CurrentVersion $currentVersion `
            -CurrentChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-current.txt")

  upgrade-install:
    if: github.event_name == 'workflow_dispatch'
    needs: contract-checks
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CURRENT_VERSION: ${{ inputs.current_version }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Download current and previous public installers and checksums
        shell: pwsh
        run: |
          $currentVersion = $env:CURRENT_VERSION
          $previousVersion = $env:PREVIOUS_VERSION
          if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid current_version: $currentVersion" }
          if ($previousVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid previous_version: $previousVersion" }
          if ([version]$previousVersion -ge [version]$currentVersion) { throw "previous_version must be lower than current_version" }
          $currentInstaller = Join-Path $env:RUNNER_TEMP "AffiliateReportSetup-v$currentVersion.exe"
          $currentChecksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-current.txt"
          $previousChecksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-previous.txt"
          # Nhiều job của lane này chạy song song và cùng kéo tệp 46 MB từ cùng một release,
          # nên GitHub trả 503 cho vài job là chuyện sẽ xảy ra. Tải một phát không thử lại biến
          # chuyện đó thành gate đỏ. Đây là chỗ yếu của bộ kiểm thử, không phải của sản phẩm.
          function Get-PublicAsset([string]$Url, [string]$OutFile) {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing $Url -OutFile $OutFile
                if ((Get-Item -LiteralPath $OutFile).Length -gt 0) { return }
                throw "Empty download"
              } catch {
                if ($attempt -eq 6) { throw "Could not download $Url after 6 attempts: $($_.Exception.Message)" }
                Start-Sleep -Seconds ([Math]::Min(30, [Math]::Pow(2, $attempt)))
              }
            }
          }
          Get-PublicAsset "https://github.com/$env:PUBLIC_UPDATE_REPO/releases/download/v$currentVersion/AffiliateReportSetup-v$currentVersion.exe" $currentInstaller
          Get-PublicAsset "https://github.com/$env:PUBLIC_UPDATE_REPO/releases/download/v$currentVersion/SHA256SUMS.txt" $currentChecksums
          # Bản trước có thể đã phát hành TRƯỚC khi đổi tên, nên asset của nó mang tên cũ.
          # windows_installer_smoke.ps1 so tên tệp cục bộ với dòng trong SHA256SUMS.txt nên phải
          # giữ đúng tên gốc. Thử tên mới trước, không có thì lùi về tên cũ — cùng nguyên tắc
          # chuyển tiếp mà bản cài trên máy người dùng đang dùng.
          function Get-PreviousInstaller([string]$Repo, [string]$Version) {
            foreach ($name in @("AffiliateReportSetup-v$Version.exe", "TikTokAffiliateReportSetup-v$Version.exe")) {
              $dich = Join-Path $env:RUNNER_TEMP $name
              try {
                Get-PublicAsset "https://github.com/$Repo/releases/download/v$Version/$name" $dich
                Write-Host "Previous installer asset: $name"
                return $dich
              } catch {
                Write-Host "Khong co asset $name, thu ten tiep theo"
              }
            }
            throw "Khong tim thay installer cua v$Version duoi bat ky ten nao"
          }
          $previousInstaller = Get-PreviousInstaller $env:PUBLIC_UPDATE_REPO $previousVersion
          "PREVIOUS_INSTALLER=$previousInstaller" >> $env:GITHUB_ENV
          Get-PublicAsset "https://github.com/$env:PUBLIC_UPDATE_REPO/releases/download/v$previousVersion/SHA256SUMS.txt" $previousChecksums
      - name: Smoke upgrade and data preservation
        shell: pwsh
        run: |
          $currentVersion = $env:CURRENT_VERSION
          $previousVersion = $env:PREVIOUS_VERSION
          .\scripts\ci\windows_installer_smoke.ps1 -Mode Upgrade `
            -CurrentInstaller (Join-Path $env:RUNNER_TEMP "AffiliateReportSetup-v$currentVersion.exe") `
            -CurrentVersion $currentVersion `
            -CurrentChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-current.txt") `
            -PreviousInstaller $env:PREVIOUS_INSTALLER `
            -PreviousVersion $previousVersion `
            -PreviousChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-previous.txt")
