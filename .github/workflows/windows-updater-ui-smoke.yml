name: Windows updater UI smoke
run-name: Public updater UI smoke ${{ inputs.previous_version }} -> ${{ inputs.current_version }} (${{ inputs.release_sha || 'manual' }}) [${{ inputs.release_nonce || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      previous_version:
        description: Public version installed before using the in-app updater
        required: true
        default: "2.0.22"
      current_version:
        description: Public version expected from the signed stable feed
        required: true
        default: "2.0.23"
      release_sha:
        description: Exact trusted source commit for release-gated runs
        required: false
        default: ""
      release_nonce:
        description: Unique dispatch marker used to bind a release to this exact smoke run
        required: false
        default: ""

permissions:
  contents: read

jobs:
  updater-ui-smoke:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PUBLIC_UPDATE_REPO: anhtahaylove/tiktok-affiliate-report
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
      CURRENT_VERSION: ${{ inputs.current_version }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_NONCE: ${{ inputs.release_nonce }}
      SMOKE_RUN: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Validate public versions and source contract
        shell: pwsh
        run: |
          $previousVersion = $env:PREVIOUS_VERSION
          $currentVersion = $env:CURRENT_VERSION
          if ($previousVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid previous_version: $previousVersion" }
          if ($currentVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid current_version: $currentVersion" }
          if ([version]$previousVersion -ge [version]$currentVersion) { throw "previous_version must be lower than current_version" }
          $sourceVersion = & python -c "from tiktok_affiliate_report.version import APP_VERSION; print(APP_VERSION)"
          if ($sourceVersion -ne $currentVersion) { throw "Workflow source version $sourceVersion does not match current_version $currentVersion" }
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($env:RELEASE_SHA -and $sourceSha -ne $env:RELEASE_SHA) { throw "Workflow source SHA $sourceSha does not match release_sha $env:RELEASE_SHA" }
          if ($env:RELEASE_SHA -and $env:RELEASE_NONCE -notmatch '^[a-f0-9]{32}$') { throw "Release-gated runs require a unique 32-character hexadecimal nonce" }
      - name: Install Playwright Chromium
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install chromium
      - name: Download public installers and checksums
        shell: pwsh
        run: |
          $repo = $env:PUBLIC_UPDATE_REPO
          # Năm máy của gate chạy song song và cùng kéo một tệp 46 MB từ cùng một release, nên
          # GitHub trả 503 cho vài máy là chuyện bình thường. Tải một phát không thử lại biến
          # chuyện bình thường đó thành gate đỏ: đo được 3/5 máy hỏng cùng lúc ở đúng bước này.
          # Đây là chỗ yếu của bộ kiểm thử, không phải của sản phẩm — nên thử lại có giới hạn.
          function Get-PublicAsset([string]$Url, [string]$OutFile) {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing $Url -OutFile $OutFile
                if ((Get-Item -LiteralPath $OutFile).Length -gt 0) { return }
                throw "Empty download"
              } catch {
                if ($attempt -eq 6) { throw "Could not download $Url after 6 attempts: $($_.Exception.Message)" }
                Start-Sleep -Seconds ([Math]::Min(30, [Math]::Pow(2, $attempt)))
              }
            }
          }
          foreach ($version in @($env:PREVIOUS_VERSION, $env:CURRENT_VERSION)) {
            Get-PublicAsset "https://github.com/$repo/releases/download/v$version/TikTokAffiliateReportSetup-v$version.exe" (Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$version.exe")
            Get-PublicAsset "https://github.com/$repo/releases/download/v$version/SHA256SUMS.txt" (Join-Path $env:RUNNER_TEMP "SHA256SUMS-v$version.txt")
          }
      - name: Run real in-app updater flow
        shell: pwsh
        run: |
          $previousVersion = $env:PREVIOUS_VERSION
          $currentVersion = $env:CURRENT_VERSION
          .\scripts\ci\windows_updater_ui_smoke.ps1 `
            -PreviousInstaller (Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$previousVersion.exe") `
            -PreviousVersion $previousVersion `
            -PreviousChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-v$previousVersion.txt") `
            -CurrentInstaller (Join-Path $env:RUNNER_TEMP "TikTokAffiliateReportSetup-v$currentVersion.exe") `
            -CurrentVersion $currentVersion `
            -CurrentChecksumFile (Join-Path $env:RUNNER_TEMP "SHA256SUMS-v$currentVersion.txt") `
            -EvidenceDir (Join-Path $env:RUNNER_TEMP "updater-ui-evidence")
      - name: Upload scrubbed updater UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: updater-ui-smoke-evidence-${{ matrix.run }}
          path: ${{ runner.temp }}/updater-ui-evidence
          if-no-files-found: warn
          retention-days: 7
